<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetch the treat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <main>
    <h1>Fetch The Treat</h1>
    <p class="intro">You are Max and you need to answer questions in order to feed Loony</p>

    <p>{{ question }}</p>
    <p>Treats: {{treats}}</p>
    <p>Wrong: {{wrong}}</p>
    <p>Streak: {{streak}}</p>
    <p>Feedback: {{message}}</p>
    <p class="mood-{{ mood }}">{{mood_name}}</p>
    <p>Helps left: {{helps_left}}</p>


    <ul>
      {% for option in options %}
      <li>
        <form action="/answer" method="post">
          <button type="submit" name="choice" value="{{ loop.index0 }}" class="button">{{option}}</button>
        </form>
      </li>
      {% endfor %}
      <li>
        <form action="/help" method="post">
          <button type="submit" class="button">Ask Loony for help</button>
        </form>
      </li>
    </ul>
  </main>
</body>

</html>
